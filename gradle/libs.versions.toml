[versions]
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
coroutines = "1.10.0"

bom="2026.02.00"
agp = "8.10.0"
androidTools = "31.4.0"
android-minSdk = "26"
android-targetSdk = "34"
android-compileSdk = "35"

androidx_core = "1.17.0"
appcompat = "1.7.0"
fragment-ktx = "1.8.9"
activity-ktx = "1.11.0"
google_material = "1.13.0"
androidx_constraintLayout = "2.1.4"
androidx_preference = "1.2.0"
androidx-recyclerview = "1.3.2"
activity_compose_version = "1.11.0"

okio = "3.10.2"
koin-bom = "4.0.2"
koin-annotation = "2.0.0"

[libraries]
# AndroidX核心库
androidx-appCompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx_core" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
# 布局组件库
google-material = { module = "com.google.android.material:material", version.ref = "google_material" }
androidx-constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx_constraintLayout" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "androidx_preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
# kotlin
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.8.1" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity_compose_version" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# koin -kotlin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-core-coroutines = { module = "io.insert-koin:koin-core-coroutines" }
# koin -android
koin-core-android = { module = "io.insert-koin:koin-android" }
#koin -compose -compose multiplatform
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation" }
# koin 注解。 android或是ktor中使用的
koin-annotations-bom = { module = "io.insert-koin:koin-annotations-bom", version.ref = "koin-annotation" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-annotation" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotation" }


slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.15" }
slf4j-api-kotlin = { module = "com.github.knightwood:slf4j-api-kotlin", version = "0.0.7" }


[plugins]
# application和library插件
application = { id = "com.android.application", version.ref = "agp" }
library = { id = "com.android.library", version.ref = "agp" }
# compose编译器
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 多平台库发布插件
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.34.0" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
